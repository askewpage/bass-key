<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тренажер басового ключа</title>
    <link rel="stylesheet" href="styles/main.css?v=24" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <h1></h1>
        </div>
      </header>

      <section class="mode-strip" aria-label="Выбор режима">
        <button id="modeNotesBtn" class="mode-btn active" type="button">Ноты</button>
        <button id="modeIntervalsBtn" class="mode-btn" type="button">Интервалы</button>
        <button id="modeRhythmBtn" class="mode-btn" type="button">Ритм</button>
      </section>

      <div class="status hidden-ui" aria-live="polite">
        <div><strong>Попыток:</strong> <span id="attempts">0</span></div>
        <div><strong>Верно:</strong> <span id="correct">0</span></div>
        <div><strong>Точность:</strong> <span id="accuracy">0%</span></div>
      </div>

      <div id="notesSection" class="trainer-section">
        <div id="noteView" class="note-view" role="img" aria-live="polite"></div>
        <div id="keyboardWrap" class="keyboard-wrap">
          <div id="keyboard" class="keyboard" aria-label="Клавиатура из 5 октав"></div>
        </div>
      </div>

      <div id="intervalSection" class="trainer-section hidden">
        <div id="intervalButtons" class="interval-buttons" aria-label="Кнопки интервалов"></div>
        <div class="interval-replay-wrap">
          <button id="replayIntervalBtn" class="tiny-btn replay-btn" type="button">↻ Еще раз</button>
        </div>
      </div>

      <div id="rhythmSection" class="trainer-section hidden">
        <div class="rhythm-toolbar">
          <label class="rhythm-bpm" for="rhythmBpmInput">
            <span>BPM</span>
            <input id="rhythmBpmInput" type="number" min="40" max="220" step="1" value="92" />
          </label>
          <button id="rhythmStartBtn" class="tiny-btn" type="button">Старт</button>
          <button id="rhythmRegenerateBtn" class="tiny-btn" type="button">Новый ритм</button>
        </div>
        <p id="rhythmHint" class="rhythm-hint">16 долей, случайные длительности в каждом квадрате.</p>
        <div id="rhythmGrid" class="rhythm-grid" aria-label="Ритмическая сетка из 16 долей"></div>
      </div>
    </main>

    <aside id="settingsDock" class="settings-dock" aria-label="Настройки">
      <button
        id="settingsGearBtn"
        class="settings-gear"
        type="button"
        aria-label="Открыть настройки"
        aria-controls="settingsPanel"
        aria-expanded="false"
      >
        <svg class="gear-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.36 7.36 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.49-.42h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.58.22-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.82 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.6.22l2.39-.96c.5.41 1.05.72 1.63.94l.36 2.54c.04.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54c.58-.22 1.12-.53 1.63-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"
          />
        </svg>
      </button>
      <div id="settingsPanel" class="settings-panel">
        <div class="controls" aria-label="Настройки тренажера">
          <div id="notesSettings" class="mode-settings">
            <div class="settings-title">Ноты</div>
            <div class="clef-row" role="tablist" aria-label="Ключ">
              <span>Ключ</span>
              <div class="mode-inline">
                <button id="noteClefBassBtn" class="mode-btn active" type="button">𝄢 Бас</button>
                <button id="noteClefTrebleBtn" class="mode-btn" type="button">𝄞 Скрипка</button>
              </div>
            </div>
            <label class="control-row" for="showLabelsToggle">
              <span>Подписи клавиш</span>
              <input id="showLabelsToggle" type="checkbox" />
            </label>
            <label class="control-row" for="accidentalsToggle">
              <span>Диезы и бемоли</span>
              <input id="accidentalsToggle" type="checkbox" />
            </label>
            <label class="control-row" for="octaveLabelsToggle">
              <span>Скрыть подписи октав</span>
              <input id="octaveLabelsToggle" type="checkbox" />
            </label>
          </div>

          <div id="intervalSettings" class="mode-settings hidden">
            <div class="settings-title">Интервалы</div>
            <div class="settings-hint">В этом режиме можно только повторно прослушать интервал и выбрать ответ.</div>
          </div>

          <div id="rhythmSettings" class="mode-settings hidden">
            <div class="settings-title">Ритм</div>
            <div class="settings-hint">Выбери длительности для генерации.</div>
            <div class="rhythm-patterns" aria-label="Выбор длительностей для раунда">
              <label class="rhythm-pattern-option" for="rhythmQuarterToggle">
                <input id="rhythmQuarterToggle" data-pattern-id="quarter" type="checkbox" checked />
                <span>♩</span>
              </label>
              <label class="rhythm-pattern-option" for="rhythmEighthsToggle">
                <input id="rhythmEighthsToggle" data-pattern-id="eighths" type="checkbox" checked />
                <span>♫</span>
              </label>
              <label class="rhythm-pattern-option" for="rhythmSixteenthsToggle">
                <input id="rhythmSixteenthsToggle" data-pattern-id="sixteenths" type="checkbox" checked />
                <span>♬</span>
              </label>
              <label class="rhythm-pattern-option" for="rhythmTripletToggle">
                <input id="rhythmTripletToggle" data-pattern-id="triplet" type="checkbox" />
                <span>♪3</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <button
      id="themeIconBtn"
      class="theme-icon-btn"
      type="button"
      aria-label="Переключить тему"
      title="Тема"
    >
      🌙
    </button>

    <div id="floatingFeedback" class="floating-feedback hidden" aria-live="polite"></div>

    <script type="module" src="js/main.js?v=24"></script>
  </body>
</html>
